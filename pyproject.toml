[project]
name = "accra-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.txt"
authors = [
    { name = "Rumen", email = "rumenmitov@disroot.org" }
]
requires-python = ">=3.12"
dependencies = [
    "accra-language",
    "vermin>=1.6.0",
]

[project.scripts]
accra-python = "accra_python:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
accra-language = { git = "https://github.com/rumenmitov/accra-language" }

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "pytest>=9.1.1",
]
